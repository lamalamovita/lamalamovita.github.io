<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Habit - Life Coaching</title>
    <!-- Import Fontu Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Link na základní styl Thinkificu pro přesnost -->
    <link rel="stylesheet" href="https://thinkific.com/assets/css/thinkific.css">
    <style>
        /* Přesné stylizace pro finální vzhled */
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #f4f4f4; 
            color: #333; 
            padding: 0; 
            margin: 0; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            background: white; 
            padding: 40px; 
            border-radius: 10px; /* Mírně zaoblené rohy */
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); /* Silnější stín */
        }
        h1 { 
            color: #2c3e50; /* Dark Blue/Grey */
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .tagline {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .btn { 
            display: inline-block; 
            padding: 12px 25px; 
            background: #3498db; /* Blue primary button */
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            margin: 10px 5px 10px 0; 
            font-weight: 600;
            transition: background 0.3s ease;
            border: none;
            cursor: pointer;
            text-align: center;
        }
        .btn:hover {
            background: #2980b9;
        }
        .btn-secondary {
            background: #95a5a6; /* Grey secondary button */
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        .stats { 
            background: #ecf0f1; 
            padding: 20px; 
            border-radius: 8px; 
            margin: 30px 0; 
            text-align: center;
            border-left: 5px solid #3498db;
        }
        .stats p {
            margin: 8px 0;
            font-size: 1.1em;
        }
        .stats strong {
            font-weight: 700;
            color: #2c3e50;
        }
        .habit-section {
            margin-top: 40px;
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 12px 0;
            border-bottom: 1px dashed #bdc3c7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li:last-child {
            border-bottom: none;
        }
        .habit-name {
            font-weight: 600;
        }
        .habit-details {
            font-size: 0.9em;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Secret Habit</h1>
        <p class="tagline">Vítejte! Vaše místo pro budování lepších návyků a život bez studu.</p>

        <div class="stats">
            <p>🔥 <strong style="color: #e74c3c;">Denní řada:</strong> 14 dní</p>
            <p>✅ <strong style="color: #2ecc71;">Dokončení:</strong> 157</p>
        </div>

        <a href="#" class="btn">+ Nový návyk</a>
        <a href="#" class="btn btn-secondary">Zobrazit vše</a>

        <div class="habit-section">
            <h2>Aktuální návyky</h2>
            <ul>
                <li>
                    <span class="habit-name">🧘 Meditace</span>
                    <span class="habit-details">10 min.</span>
                </li>
                <li>
                    <span class="habit-name">📚 Čtení</span>
                    <span class="habit-details">20 stran</span>
                </li>
            </ul>
        </div>
        
        <!-- Zde by mohlo jít více kurzů/seznamů -->
        <div class="habit-section" style="margin-top: 60px;">
            <h2>Knihovna návyků</h2>
            <ul style="display: flex; gap: 15px; flex-wrap: wrap;">
                <li style="border-bottom: none;">
                    <span class="habit-name" style="background: #3498db; color: white; padding: 10px 20px; border-radius: 5px;">Morning Routine</span>
                </li>
                <li style="border-bottom: none;">
                    <span class="habit-name" style="background: #2ecc71; color: white; padding: 10px 20px; border-radius: 5px;">Trénink s váhou</span>
                </li>
                <li style="border-bottom: none;">
                    <span class="habit-name" style="background: #9b59b6; color: white; padding: 10px 20px; border-radius: 5px;">Detox</span>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
