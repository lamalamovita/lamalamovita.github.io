<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Habit - Lama Lamovitá</title>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f4f4; margin: 0; color: #333; }
        .moje-sekce { text-align: center; padding: 30px; background: white; border-bottom: 3px solid #2980b9; }
        .moje-sekce img { width: 100%; max-width: 700px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .moje-sekce p { font-size: 1.8em; font-weight: bold; margin-top: 15px; color: #2c3e50; }
        
        .kurzy-container { max-width: 1000px; margin: 40px auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .kurz-karta { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .kurz-karta:hover { transform: translateY(-5px); }
        .kurz-karta img { width: 100%; height: 200px; object-fit: cover; }
        .kurz-obsah { padding: 20px; text-align: center; }
        .btn { display: inline-block; padding: 10px 20px; background: #2980b9; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="moje-sekce">
        <img src="./uvod.jpg" alt="Uvítací fotka">
        <p>Trochu sem upravil web.. tady lama lamovitá</p>
    </div>

    <div class="kurzy-container">
        <!-- KURZ 1 -->
        <div class="kurz-karta">
            <img src="https://thinkific.com">
            <div class="kurz-obsah">
                <h3>Cesta z pornopasti</h3>
                <p>Online kurz pro svobodu v digitálním věku.</p>
                <a href="https://thinkific.com" class="btn">Zobrazit kurz</a>
            </div>
        </div>
        
        <!-- KURZ 2 -->
        <div class="kurz-karta">
            <img src="https://unsplash.com">
            <div class="kurz-obsah">
                <h3>Deník návyků</h3>
                <p>Zapisuj si své pokroky každý den.</p>
                <a href="./denik.html" class="btn" style="background:#27ae60;">Můj Deník</a>
            </div>
        </div>
    </div>
</body>
</html>
