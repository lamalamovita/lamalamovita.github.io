<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Habit - Lama Lamovitá</title>
    <!-- Načtení originálních stylů Thinkificu -->
    <link rel="stylesheet" href="https://thinkific.com">
    <style>
        body { margin: 0; font-family: 'Montserrat', sans-serif; }
        .lama-header { text-align: center; padding: 20px; background: white; border-bottom: 2px solid #2980b9; }
        .lama-header img { width: 100%; max-width: 800px; border-radius: 15px; }
        .lama-header p { font-size: 1.8em; font-weight: bold; margin-top: 15px; }
        /* Oprava pro zobrazení mřížky bez JS */
        .course-card-grid { display: flex; justify-content: center; padding: 40px; list-style: none; }
        .course-card { max-width: 350px; border: 1px solid #eee; border-radius: 8px; overflow: hidden; background: white; transition: 0.3s; }
        .course-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .course-card__img-container img { width: 100%; display: block; }
        .course-card__body { padding: 20px; text-align: center; }
    </style>
</head>
<body class="home-landing-page">

    <div class="lama-header">
        <img src="./uvod.jpg" alt="Uvítací fotka">
        <p>Trochu sem upravil web.. tady lama lamovitá</p>
    </div>

    <main class="home" id="main-content">
        <section class="course-list">
            <div class="container">
                <ul class="course-card-grid">
                    <li class="course-card-grid__item">
                        <a class="course-card course-card--public" href="https://thinkific.com">
                            <div class="course-card__img-container">
                                <img src="https://thinkific.com" alt="Cesta z pornopasti">
                            </div>
                            <div class="course-card__body">
                                <h3 class="course-card__title">Cesta z pornopasti</h3>
                                <div class="course-card__details">Kurz pro vaši svobodu</div>
                                <div class="course-card__price">Zdarma</div>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>
        </section>
    </main>

</body>
</html>
